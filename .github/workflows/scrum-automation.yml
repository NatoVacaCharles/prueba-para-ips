# ============================================================
# SCRUM AUTOMATION — Dinosaur Exploder | IPS 2026-A
# Archivo: .github/workflows/scrum-automation.yml
#
# Automatiza tareas repetitivas del proceso Scrum:
#   - Al abrir un Issue: agregar al Project Backlog
#   - Al cerrar un Issue: actualizar el burndown counter
#   - Al crear un PR: verificar que está vinculado a un Issue
#   - Schedule diario: generar reporte de progreso del Sprint
# ============================================================

name: Scrum Automation

on:
  issues:
    types: [opened, closed, labeled, unlabeled]
  pull_request:
    types: [opened, ready_for_review]
  schedule:
    # Reporte diario a las 8:00 AM UTC (3:00 AM Perú)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read
  repository-projects: write

jobs:
  # --------------------------------------------------------
  # JOB 1: Verificar que PRs tienen Issues vinculados
  # --------------------------------------------------------
  check-pr-has-issue:
    name: Verificar PR vinculado a Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    steps:
      - name: Verificar cuerpo del PR tiene referencia a Issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title || '';

            // Buscar referencias como "Closes #123", "Fixes #45", "Refs #67"
            const issueRef = /(?:closes?|fixes?|resolves?|refs?)\s+#(\d+)/gi;
            const hasRef = issueRef.test(body) || issueRef.test(title);

            if (!hasRef) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## ⚠️ Este PR no está vinculado a un Issue del Sprint

            Por favor, agrega una referencia en el cuerpo del PR:
            - \`Closes #NRO_ISSUE\` — para cerrar el issue al mergear
            - \`Refs #NRO_ISSUE\` — para solo referenciar sin cerrar

            Ejemplo:
            \`\`\`
            ## Descripción
            Implementación de i18n en español para el HUD del juego.

            Closes #42
            \`\`\`

            Esto es requerido por el proceso Scrum del curso IPS 2026-A.`
              });
              core.setFailed('PR debe estar vinculado a un Issue del Sprint');
            } else {
              console.log('✅ PR correctamente vinculado a un Issue');
            }

  # --------------------------------------------------------
  # JOB 2: Auto-etiquetar Issues nuevos según palabras clave
  # --------------------------------------------------------
  auto-label-issues:
    name: Auto-etiquetar Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'

    steps:
      - name: Aplicar etiquetas automáticas
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const content = title + ' ' + body;

            const labels = [];

            // Detectar tipo de Issue
            if (content.includes('bug') || content.includes('error') || content.includes('fallo')) {
              labels.push('type: bug');
            }
            if (content.includes('feature') || content.includes('mejora') || content.includes('nueva funcionalidad')) {
              labels.push('type: enhancement');
            }
            if (content.includes('doc') || content.includes('documentaci')) {
              labels.push('type: documentation');
            }
            if (content.includes('test') || content.includes('prueba') || content.includes('cobertura')) {
              labels.push('type: testing');
            }
            if (content.includes('ci') || content.includes('cd') || content.includes('devops') || content.includes('pipeline')) {
              labels.push('type: devops');
            }

            // Detectar módulo afectado
            if (content.includes('hitbox') || content.includes('colision') || content.includes('enemy') || content.includes('enemigo')) {
              labels.push('module: game-engine');
            }
            if (content.includes('achievement') || content.includes('logro') || content.includes('specialty')) {
              labels.push('module: achievements');
            }
            if (content.includes('website') || content.includes('next') || content.includes('sitio web')) {
              labels.push('module: website');
            }
            if (content.includes('i18n') || content.includes('traduccion') || content.includes('idioma') || content.includes('español')) {
              labels.push('module: i18n');
            }

            // Detectar prioridad
            if (content.includes('crítico') || content.includes('urgente') || content.includes('bloqueante')) {
              labels.push('priority: high');
            }

            // Agregar etiqueta de sprint si no tiene
            labels.push('sprint: 1');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
              console.log('Etiquetas aplicadas:', labels);
            }

  # --------------------------------------------------------
  # JOB 3: Reporte diario del Sprint (ejecuta en schedule)
  # --------------------------------------------------------
  daily-sprint-report:
    name: Reporte Diario del Sprint
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Generar reporte de progreso
        uses: actions/github-script@v7
        with:
          script: |
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sprint: 1'
            });

            const { data: closedIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              labels: 'sprint: 1'
            });

            const total = openIssues.length + closedIssues.length;
            const done = closedIssues.length;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;

            const reportBody = `## 📊 Reporte Diario Sprint 1 — ${new Date().toLocaleDateString('es-PE')}

            | Métrica | Valor |
            |---------|-------|
            | Issues totales en Sprint 1 | ${total} |
            | Issues completados | ${done} |
            | Issues pendientes | ${openIssues.length} |
            | Progreso | ${pct}% |

            ### Issues pendientes:
            ${openIssues.map(i => `- [ ] #${i.number} ${i.title}`).join('\n') || 'No hay issues pendientes 🎉'}

            ### Issues completados:
            ${closedIssues.slice(0, 10).map(i => `- [x] #${i.number} ${i.title}`).join('\n') || 'Ninguno aún'}

            ---
            *Generado automáticamente por GitHub Actions · IPS 2026-A*`;

            console.log(reportBody);
            core.setOutput('report', reportBody);
