# ============================================================
# CI PIPELINE — Dinosaur Exploder | IPS 2026-A
# Archivo: .github/workflows/ci.yml
#
# Disparadores:
#   - Push a cualquier rama
#   - Pull Request hacia main o develop
#
# Jobs:
#   1. build-and-test   → Compilar, tests unitarios, cobertura
#   2. code-quality     → Spotless (formato) + PMD (estático)
#   3. website-lint     → Lint del frontend Next.js
# ============================================================

name: CI — Build, Test & Quality

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # --------------------------------------------------------
  # JOB 1: Compilar el juego Java y correr pruebas unitarias
  # --------------------------------------------------------
  build-and-test:
    name: Build & Test (Java)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compilar sin ejecutar pruebas (para detección rápida de errores)
      - name: Compilar proyecto
        run: mvn clean compile --no-transfer-progress

      # Correr tests unitarios con reporte de cobertura JaCoCo
      - name: Ejecutar pruebas unitarias
        run: mvn test --no-transfer-progress
        env:
          # Modo headless para entornos sin display (Ubuntu CI)
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      # Generar reporte de cobertura JaCoCo
      - name: Generar reporte de cobertura (JaCoCo)
        run: mvn jacoco:report --no-transfer-progress
        if: always()

      # Subir reporte de cobertura como artefacto descargable
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 30

      # Publicar resultados de tests en el PR/commit
      - name: Publicar resultados de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit

  # --------------------------------------------------------
  # JOB 2: Análisis de calidad de código
  # --------------------------------------------------------
  code-quality:
    name: Code Quality (Spotless + PMD)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Verificar formato de código con Spotless (falla si no está formateado)
      - name: Verificar formato de código (Spotless)
        run: mvn spotless:check --no-transfer-progress

      # Análisis estático con PMD (detecta code smells y malas prácticas)
      - name: Análisis estático (PMD)
        run: mvn pmd:check --no-transfer-progress

      # Subir reporte PMD como artefacto
      - name: Subir reporte PMD
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: 14