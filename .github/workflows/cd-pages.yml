# ============================================================
# CD PIPELINE — Dinosaur Exploder | IPS 2026-A
# Archivo: .github/workflows/cd-pages.yml
#
# Disparadores:
#   - Push exitoso a la rama main (tras pasar CI)
#   - Ejecución manual desde la UI de GitHub (workflow_dispatch)
#
# Jobs:
#   1. generate-docs     → Genera página de documentación del Sprint
#   2. generate-burndown → Calcula y grafica el Burndown Chart
#   3. deploy-pages      → Publica todo en GitHub Pages
# ============================================================

name: CD — Deploy to GitHub Pages (Staging)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sprint_number:
        description: 'Número de Sprint a documentar'
        required: false
        default: '1'

# Permisos necesarios para escribir en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo una ejecución simultánea de despliegue
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------
  # JOB 1: Generar documentación del Sprint actual
  # --------------------------------------------------------
  generate-docs:
    name: Generar Documentación del Sprint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para estadísticas de commits

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y generar reporte de cobertura
        run: |
          mvn clean test jacoco:report --no-transfer-progress || true
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Preparar carpeta docs/
        run: |
          mkdir -p docs/coverage
          # Copiar reporte de cobertura si existe
          if [ -d "target/site/jacoco" ]; then
            cp -r target/site/jacoco/. docs/coverage/
          fi

      # Copiar la página del Sprint (generada por el equipo)
      - name: Copiar página principal del Sprint
        run: |
          if [ -f "docs-src/index.html" ]; then
            cp docs-src/index.html docs/index.html
          fi

  # --------------------------------------------------------
  # JOB 2: Generar Burndown Chart automático
  # --------------------------------------------------------
  generate-burndown:
    name: Generar Burndown Chart
    runs-on: ubuntu-latest
    needs: generate-docs

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: pip install matplotlib requests python-dateutil

      # Script que genera el burndown chart como SVG/PNG
      - name: Generar Burndown Chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SPRINT_START: "2026-05-13"
          SPRINT_END: "2026-05-27"
          TOTAL_POINTS: "28"
        run: |
          python3 scripts/generate_burndown.py \
            --token "$GITHUB_TOKEN" \
            --repo "$REPO" \
            --sprint-start "$SPRINT_START" \
            --sprint-end "$SPRINT_END" \
            --total-points "$TOTAL_POINTS" \
            --output docs/burndown.html || echo "Burndown generation skipped (script not found)"

      - name: Subir todo a Pages
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-artifact # Cambiamos el nombre para que sea único
          path: docs/
          retention-days: 1
          
  # --------------------------------------------------------
  # JOB 3: Desplegar todo en GitHub Pages
  # --------------------------------------------------------
  deploy-pages:
    name: Desplegar en GitHub Pages
    runs-on: ubuntu-latest
    needs: [generate-docs, generate-burndown]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar todo el contenido empaquetado
        uses: actions/download-artifact@v4
        with:
          name: github-pages-artifact
          path: ./pages-output

      # Si no hay index.html, usar la página del repositorio directamente
      - name: Verificar contenido de páginas
        run: |
          ls -la ./pages-output/
          if [ ! -f "./pages-output/index.html" ]; then
            echo "ADVERTENCIA: No se encontró index.html. Asegúrate de tener docs-src/index.html"
            # Fallback: copiar desde docs/ si existe
            if [ -d "docs" ] && [ -f "docs/index.html" ]; then
              cp -r docs/. ./pages-output/
            fi
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-output

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar URL del despliegue
        run: |
          echo "✅ Desplegado exitosamente en: ${{ steps.deployment.outputs.page_url }}"
